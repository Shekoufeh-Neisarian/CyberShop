{% extends "base.html" %}
{% block title %}404 — CyberShop{% endblock %}
{% block content %}

<div class="error-page">
  <div class="error-code">404</div>
  <p class="error-msg">Page not found.</p>
  <a href="{{ url_for('index') }}" class="btn btn-primary">← Back to Shop</a>

  <div class="callout mt3" style="max-width:480px; margin:2rem auto; text-align:left">
    Open DevTools → <strong>Network</strong> tab and reload this page.
    The status code for this request is <code>404 Not Found</code>.
    Compare it to a normal page (200 OK).
  </div>
</div>

{% endblock %}
